<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Linea</title>
  <link rel="icon" type="image/webp" href="/linea-3.webp" />
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body class="grid grid-cols-[var(--width-sidebar)_1fr] grid-rows-[40px_1fr] h-screen h-[100dvh] overflow-hidden bg-bg text-text font-mono text-sm">

<header class="col-span-full flex items-center gap-[10px] px-4 border-b border-border bg-surface">
  <div class="w-1.5 h-1.5 rounded-full bg-border2" aria-hidden="true"></div>
  <h1 class="text-xs font-medium tracking-widest uppercase text-muted">Linea</h1>
  <span id="status-text" role="status" aria-live="polite" class="ml-auto text-xs text-muted font-mono tabular-nums">idle</span>
</header>

<aside aria-label="Controls" class="bg-surface border-r border-border overflow-y-auto px-4 py-3 flex flex-col gap-0">

  <!-- Drop zone -->
  <div class="relative mb-[14px] p-5 text-center cursor-pointer border border-dashed border-border2 rounded-sm text-base leading-[1.8] text-muted hover:border-border hover:bg-surface2 hover:text-text transition-colors" id="drop-zone">
    <input type="file" id="file-input" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full" accept="image/jpeg,image/png,image/webp,image/gif,image/bmp,image/tiff" aria-label="Upload image file" />
    <div>drop image or click to browse</div>
    <span class="block mt-1 text-xs text-text overflow-hidden text-ellipsis whitespace-nowrap" id="fname"></span>
  </div>

  <!-- Scanline params -->
  <div class="text-xs tracking-widest uppercase text-muted my-3 pb-1 border-b border-border" aria-hidden="true">Scanlines</div>

  <div class="flex items-center gap-1.5 mb-1.5 ctrl">
    <label class="w-[90px] shrink-0 text-muted text-xs cursor-default" for="s-rs">row spacing</label>
    <input type="range" id="s-rs" min="2" max="16" step="1" value="5" class="flex-1" />
    <span class="w-[34px] text-right text-text text-xs font-medium tabular-nums shrink-0" id="v-rs" aria-live="polite">5</span>
  </div>
  <div class="flex items-center gap-1.5 mb-1.5 ctrl">
    <label class="w-[90px] shrink-0 text-muted text-xs cursor-default" for="s-dl">dash length</label>
    <input type="range" id="s-dl" min="1" max="12" step="0.2" value="3.2" class="flex-1" />
    <span class="w-[34px] text-right text-text text-xs font-medium tabular-nums shrink-0" id="v-dl" aria-live="polite">3.2</span>
  </div>
  <div class="flex items-center gap-1.5 mb-1.5 ctrl">
    <label class="w-[90px] shrink-0 text-muted text-xs cursor-default" for="s-mg">min gap</label>
    <input type="range" id="s-mg" min="0.5" max="10" step="0.5" value="1.8" class="flex-1" />
    <span class="w-[34px] text-right text-text text-xs font-medium tabular-nums shrink-0" id="v-mg" aria-live="polite">1.8</span>
  </div>
  <div class="flex items-center gap-1.5 mb-1.5 ctrl">
    <label class="w-[90px] shrink-0 text-muted text-xs cursor-default" for="s-tl">tilt</label>
    <input type="range" id="s-tl" min="-4" max="4" step="0.1" value="-0.6" class="flex-1" />
    <span class="w-[34px] text-right text-text text-xs font-medium tabular-nums shrink-0" id="v-tl" aria-live="polite">-0.6</span>
  </div>

  <!-- Image params -->
  <div class="text-xs tracking-widest uppercase text-muted my-3 pb-1 border-b border-border" aria-hidden="true">Image</div>

  <div class="flex items-center gap-1.5 mb-1.5 ctrl">
    <label class="w-[90px] shrink-0 text-muted text-xs cursor-default" for="s-ct">contrast</label>
    <input type="range" id="s-ct" min="0.5" max="4" step="0.1" value="1.3" class="flex-1" />
    <span class="w-[34px] text-right text-text text-xs font-medium tabular-nums shrink-0" id="v-ct" aria-live="polite">1.3</span>
  </div>
  <div class="flex items-center gap-1.5 mb-1.5 ctrl">
    <label class="w-[90px] shrink-0 text-muted text-xs cursor-default" for="s-md">max dim</label>
    <input type="range" id="s-md" min="200" max="4000" step="100" value="1200" class="flex-1" />
    <span class="w-[34px] text-right text-text text-xs font-medium tabular-nums shrink-0" id="v-md" aria-live="polite">1200</span>
  </div>

  <!-- Dither mode -->
  <div class="text-xs tracking-widest uppercase text-muted my-3 pb-1 border-b border-border" aria-hidden="true">Algorithm</div>
  <div class="flex flex-col gap-1 mb-2.5" id="mode-seg-wrap" role="group" aria-label="Dither algorithm">
    <div class="flex border border-border rounded-sm overflow-hidden mb-2.5">
      <button class="flex-1 py-1.5 px-1 bg-surface2 text-text font-mono text-xs cursor-pointer transition-colors on" data-v="floyd" aria-pressed="true">Floyd</button>
      <button class="flex-1 py-1.5 px-1 bg-transparent text-muted font-mono text-xs cursor-pointer transition-colors border-r border-border last:border-r-0" data-v="bayer4" aria-pressed="false">Bayer 4</button>
      <button class="flex-1 py-1.5 px-1 bg-transparent text-muted font-mono text-xs cursor-pointer transition-colors border-r border-border last:border-r-0" data-v="bayer8" aria-pressed="false">Bayer 8</button>
    </div>
    <div class="flex border border-border rounded-sm overflow-hidden mb-2.5">
      <button class="flex-1 py-1.5 px-1 bg-transparent text-muted font-mono text-xs cursor-pointer transition-colors border-r border-border last:border-r-0" data-v="atkinson" aria-pressed="false">Atkinson</button>
      <button class="flex-1 py-1.5 px-1 bg-transparent text-muted font-mono text-xs cursor-pointer transition-colors border-r border-border last:border-r-0" data-v="stucki" aria-pressed="false">Stucki</button>
      <button class="flex-1 py-1.5 px-1 bg-transparent text-muted font-mono text-xs cursor-pointer transition-colors border-r border-border last:border-r-0" data-v="pixel" aria-pressed="false">Pixel</button>
    </div>
  </div>

  <!-- Appearance -->
  <div class="text-xs tracking-widest uppercase text-muted my-3 pb-1 border-b border-border" aria-hidden="true">Appearance</div>

  <div class="flex items-center gap-1.5 mb-1.5 ctrl">
    <label class="w-[90px] shrink-0 text-muted text-xs cursor-default" for="s-sw">stroke wt</label>
    <input type="range" id="s-sw" min="0.25" max="4" step="0.25" value="0.75" class="flex-1" />
    <span class="w-[34px] text-right text-text text-xs font-medium tabular-nums shrink-0" id="v-sw" aria-live="polite">0.75</span>
  </div>

  <div class="flex items-center gap-1.5 mb-1.5">
    <span class="text-muted text-xs font-mono w-[76px] shrink-0">stroke</span>
    <div class="relative w-[22px] h-[22px] rounded-sm border border-border2 overflow-hidden shrink-0" id="sw-stroke" style="background:#131315">
      <input type="color" id="cp-stroke" class="absolute -inset-1 w-[calc(100%+8px)] h-[calc(100%+8px)] opacity-0 cursor-pointer" value="#131315" aria-label="Stroke color picker" />
    </div>
    <input class="w-[72px] bg-surface2 border border-border rounded-sm px-1.5 py-1 text-text text-xs font-mono tabular-nums uppercase outline-none focus:border-border2" id="hex-stroke" value="#131315" maxlength="7" aria-label="Stroke color hex value" />
  </div>

  <div class="flex items-center gap-1.5 mb-1.5">
    <span class="text-muted text-xs font-mono w-[76px] shrink-0">grad to</span>
    <div class="relative w-[22px] h-[22px] rounded-sm border border-border2 overflow-hidden shrink-0 opacity-40" id="sw-grad" style="background:#888888">
      <input type="color" id="cp-grad" class="absolute -inset-1 w-[calc(100%+8px)] h-[calc(100%+8px)] opacity-0 cursor-pointer" value="#888888" aria-label="Gradient end color picker" disabled />
    </div>
    <input class="w-[72px] bg-surface2 border border-border rounded-sm px-1.5 py-1 text-text text-xs font-mono tabular-nums uppercase outline-none focus:border-border2 disabled:opacity-50" id="hex-grad" value="#888888" maxlength="7" aria-label="Gradient end color hex value" disabled />
    <label class="flex items-center gap-1 ml-0.5 text-xs text-muted cursor-pointer">
      <input type="checkbox" id="grad-on" class="w-2.5 h-2.5 cursor-pointer accent-muted" /> on
    </label>
  </div>
  <div class="flex border border-border rounded-sm overflow-hidden mb-1.5" id="grad-dir-seg" role="group" aria-label="Gradient direction" style="display:none">
    <button class="flex-1 py-1 px-1 bg-surface2 text-text font-mono text-xs cursor-pointer transition-colors on" data-d="h" aria-pressed="true">→</button>
    <button class="flex-1 py-1 px-1 bg-transparent text-muted font-mono text-xs cursor-pointer transition-colors border-r border-border last:border-r-0" data-d="v" aria-pressed="false">↓</button>
    <button class="flex-1 py-1 px-1 bg-transparent text-muted font-mono text-xs cursor-pointer transition-colors border-r border-border last:border-r-0" data-d="d" aria-pressed="false">↘</button>
  </div>

  <div class="flex items-center gap-1.5 mb-1.5">
    <span class="text-muted text-xs font-mono w-[76px] shrink-0">background</span>
    <div class="relative w-[22px] h-[22px] rounded-sm border border-border2 overflow-hidden shrink-0" id="sw-bg" style="background:#f5f5f0">
      <input type="color" id="cp-bg" class="absolute -inset-1 w-[calc(100%+8px)] h-[calc(100%+8px)] opacity-0 cursor-pointer" value="#f5f5f0" aria-label="Background color picker" />
    </div>
    <input class="w-[72px] bg-surface2 border border-border rounded-sm px-1.5 py-1 text-text text-xs font-mono tabular-nums uppercase outline-none focus:border-border2" id="hex-bg" value="#f5f5f0" maxlength="7" aria-label="Background color hex value" />
    <label class="flex items-center gap-1 ml-0.5 text-xs text-muted cursor-pointer">
      <input type="checkbox" id="bg-none" class="w-2.5 h-2.5 cursor-pointer accent-muted" /> none
    </label>
  </div>

  <!-- Actions -->
  <div class="grid grid-cols-2 gap-1.5 mt-3.5">
    <button class="py-1.5 rounded-sm border border-border bg-transparent text-muted text-xs font-mono cursor-pointer hover:bg-surface2 hover:text-text transition-colors disabled:opacity-30 disabled:cursor-not-allowed" id="btn-render" disabled>render</button>
    <div class="relative flex">
      <button class="flex-1 py-1.5 rounded-l-sm border border-text bg-text text-bg text-xs font-mono font-semibold cursor-pointer hover:bg-text-dim transition-colors disabled:opacity-30 disabled:cursor-not-allowed" id="btn-dl" disabled>↓ SVG</button>
      <button class="w-[26px] shrink-0 rounded-r-sm border-y border-r border-text border-l border-l-bg bg-text text-bg text-xs font-mono cursor-pointer hover:bg-text-dim transition-colors disabled:opacity-30 disabled:cursor-not-allowed" id="btn-dl-fmt" disabled aria-label="Choose download format" aria-haspopup="true" aria-expanded="false">▾</button>
      <div class="absolute bottom-[calc(100%+4px)] right-0 min-w-full bg-surface2 border border-border rounded-sm overflow-hidden z-10 hidden" id="dl-menu" role="menu" aria-label="Download format">
        <button role="menuitem" data-fmt="svg" class="block w-full px-2.5 py-1.5 text-left bg-transparent text-muted font-mono text-xs cursor-pointer hover:bg-surface hover:text-text transition-colors active:text-text">SVG</button>
        <button role="menuitem" data-fmt="png" class="block w-full px-2.5 py-1.5 text-left bg-transparent text-muted font-mono text-xs cursor-pointer hover:bg-surface hover:text-text transition-colors">PNG</button>
        <button role="menuitem" data-fmt="jpeg" class="block w-full px-2.5 py-1.5 text-left bg-transparent text-muted font-mono text-xs cursor-pointer hover:bg-surface hover:text-text transition-colors">JPEG</button>
        <button role="menuitem" data-fmt="webp" class="block w-full px-2.5 py-1.5 text-left bg-transparent text-muted font-mono text-xs cursor-pointer hover:bg-surface hover:text-text transition-colors">WebP</button>
      </div>
    </div>
  </div>

  <!-- Stats -->
  <div class="mt-2.5 flex flex-col gap-1 hidden" id="stats" aria-label="Render statistics">
    <div class="flex justify-between text-xs text-muted tabular-nums">dashes <span id="st-dashes" class="text-text font-medium">—</span></div>
    <div class="flex justify-between text-xs text-muted tabular-nums">size <span id="st-size" class="text-text font-medium">—</span></div>
    <div class="flex justify-between text-xs text-muted tabular-nums">dimensions <span id="st-dims" class="text-text font-medium">—</span></div>
  </div>

  <div class="mt-auto pt-6 text-xs text-text font-mono tracking-wider opacity-80">
    &copy; michael nau, 2026
  </div>

</aside>

<main id="main" class="overflow-auto flex items-center justify-center bg-bg relative">
  <div class="flex flex-col items-center gap-2 text-muted text-base text-center pointer-events-none" id="empty-state">
    <div class="grid grid-cols-[repeat(12,8px)] grid-rows-[repeat(8,8px)] gap-[3px] opacity-25 mb-2 empty-grid" aria-hidden="true"></div>
    <div>load an image to begin</div>
  </div>

  <div id="preview-wrap" class="hidden max-w-full max-h-full relative">
    <object id="preview-img" type="image/svg+xml" aria-label="Generated SVG preview" class="block max-w-[calc(100vw-var(--width-sidebar)-20px)] max-h-[calc(100dvh-60px)] border border-border"></object>
    <div class="hidden absolute inset-0 bg-bg-overlay items-center justify-center text-base text-muted tracking-widest" id="spinner" aria-hidden="true">rendering…</div>
  </div>
</main>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
